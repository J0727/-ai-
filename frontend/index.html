<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智汇研途 - AI科研辅助平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root { --brand: #7c3aed; --brand-dark: #6d28d9; }
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: #f3f4f6; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">
    <!-- 顶部 Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm z-20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center text-white text-xl shadow-md">
                <i class="fa-solid fa-brain"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-800 leading-tight">智汇研途
                    <span class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full ml-1 align-middle">Beta</span>
                </h1>
                <p class="text-xs text-slate-500">基于多智能体协作的科研辅助系统</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-xs font-medium text-slate-600">DeepSeek-V4-Pro Ready</span>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-1 flex overflow-hidden">
        <!-- 左侧边栏 -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 hidden md:flex">
            <div class="p-4 border-b border-slate-100">
                <button id="newProjectBtn" class="w-full bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white py-2.5 rounded-lg font-medium transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> 新建研究课题
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-3">
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">项目历史</p>
                <div class="project-item p-3 rounded-lg bg-purple-50 border border-purple-100 cursor-pointer">
                    <h3 class="font-semibold text-sm text-purple-900 truncate">大语言模型在医疗诊断中的应用</h3>
                    <p class="text-xs text-purple-600 mt-1">2026-10-28 • 进行中</p>
                </div>
                <div class="project-item p-3 rounded-lg hover:bg-slate-50 border border-transparent hover:border-slate-200 cursor-pointer transition-all">
                    <h3 class="font-semibold text-sm text-slate-700 truncate">量子计算基础算法综述</h3>
                    <p class="text-xs text-slate-500 mt-1">2026-10-25 • 已完成</p>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 text-xs text-slate-400 text-center">
                &copy; 2026 智汇研途 Team
            </div>
        </aside>

        <!-- 主工作区 -->
        <section class="flex-1 flex flex-col bg-slate-50 min-w-0">
            <div class="px-6 py-4 bg-white/50 backdrop-blur-sm border-b border-slate-200 flex justify-between items-center">
                <div>
                    <h2 id="currentProjectTitle" class="text-lg font-bold text-slate-800">大语言模型在医疗诊断中的应用</h2>
                    <div class="flex gap-2 mt-1">
                        <span class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded">RAG增强</span>
                        <span class="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded">多智能体协作</span>
                    </div>
                </div>
                <button class="px-3 py-1.5 text-sm border border-slate-300 rounded-md hover:bg-white text-slate-600 transition-colors shrink-0">
                    <i class="fa-solid fa-file-export mr-1"></i> 导出报告
                </button>
            </div>

            <!-- 聊天消息区 -->
            <div id="chatContainer" class="flex-1 overflow-y-auto px-6 py-6 space-y-4">
                <p class="text-slate-400 text-center mt-20">界面布局搭建完成，后续将补充交互逻辑</p>
            </div>

            <!-- 输入区 -->
            <div class="p-4 bg-white border-t border-slate-200">
                <div class="max-w-4xl mx-auto flex items-end gap-3">
                    <textarea id="userInput" rows="1"
                        placeholder="输入你的研究问题，例如：帮我总结一下 Transformer 架构在 NLP 领域的最新进展..."
                        class="flex-1 px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none resize-none text-sm"></textarea>
                    <button id="sendBtn" class="px-5 py-3 bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white rounded-xl font-medium transition-all shadow-md flex items-center gap-2 shrink-0">
                        <i class="fa-solid fa-paper-plane"></i> 发送
                    </button>
                </div>
                <p class="max-w-4xl mx-auto text-xs text-slate-400 mt-2">Enter 发送 · Shift+Enter 换行 · 内容由 AI 生成，请核实关键结论</p>
            </div>
        </section>
    </main>
</body>
</html>
